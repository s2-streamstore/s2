[graph]
all-features = true

[advisories]
ignore = [
    # Transitive deps via slatedb/foyer — not actionable.
    "RUSTSEC-2024-0436", # paste unmaintained
    "RUSTSEC-2025-0141", # bincode unmaintained
    "RUSTSEC-2024-0449", # unsafe-libyaml via SlateDB/figment; YAML-file config unused

    # Temporary risk acceptance while rustls 0.23.46 completes the 7-day cooldown.
    # TODO(2026-10-21): upgrade after 09:54:15 UTC and remove these four ignores.
    # This date is a manual deadline, not an automatically enforced expiry.
    { id = "RUSTSEC-2026-0346", reason = "Until 2026-10-21: rustls 0.23.46 cooldown; no custom session-value Debug logging in this workspace." },
    { id = "RUSTSEC-2026-0347", reason = "Until 2026-10-21: rustls 0.23.46 cooldown; ECH is not configured in this workspace." },
    { id = "RUSTSEC-2026-0348", reason = "Until 2026-10-21: rustls 0.23.46 cooldown; the rustls brotli feature is disabled." },
    { id = "RUSTSEC-2026-0349", reason = "Until 2026-10-21: accept post-quantum downgrade risk while rustls 0.23.46 completes its cooldown." },
]

[licenses]
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MPL-2.0",
    "OpenSSL",
    "Unicode-3.0",
    "Zlib",
]

[bans]
multiple-versions = "warn"
deny = [
    { crate = "openssl", use-instead = "rustls-tls" },
    { crate = "openssl-sys", use-instead = "rustls-tls" },
    # TODO { crate = "ring", use-instead = "aws-lc-rs" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-git = [
    "https://github.com/slatedb/slatedb",
    "https://github.com/infiniteregrets/utoipa",
]
