[graph]
all-features = true

[advisories]
ignore = [
    # Transitive deps via slatedb/foyer — not actionable.
    "RUSTSEC-2024-0436", # paste unmaintained
    "RUSTSEC-2025-0141", # bincode unmaintained
    "RUSTSEC-2024-0449", # unsafe-libyaml via SlateDB/figment; YAML-file config unused

    # Keep the existing Linux keyring stack; these standalone crates moved into zbus 6.
    { id = "RUSTSEC-2026-0370", reason = "Accept zvariant maintenance advisory for the existing transitive Linux keyring stack." },
    { id = "RUSTSEC-2026-0371", reason = "Accept zbus_names maintenance advisory for the existing transitive Linux keyring stack." },
    { id = "RUSTSEC-2026-0372", reason = "Accept zvariant_derive maintenance advisory for the existing transitive Linux keyring stack." },
]

[licenses]
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MPL-2.0",
    "OpenSSL",
    "Unicode-3.0",
    "Zlib",
]

[bans]
multiple-versions = "warn"
deny = [
    { crate = "openssl", use-instead = "rustls-tls" },
    { crate = "openssl-sys", use-instead = "rustls-tls" },
    # TODO { crate = "ring", use-instead = "aws-lc-rs" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-git = [
    "https://github.com/slatedb/slatedb",
    "https://github.com/infiniteregrets/utoipa",
]
