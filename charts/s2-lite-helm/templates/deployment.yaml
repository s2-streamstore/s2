{{- $storageMode := include "s2-lite.storage.mode" . }}
{{- $walMode := include "s2-lite.walStorage.mode" . }}
{{- $volumes := include "s2-lite.persistentVolumes" . | fromYaml }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "s2-lite.fullname" . }}
  labels:
    {{- include "s2-lite.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "s2-lite.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "s2-lite.labels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "s2-lite.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
      - name: s2-lite
        securityContext:
          {{- toYaml .Values.securityContext | nindent 12 }}
        image: {{ include "s2-lite.image" . }}
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        args:
          - lite
          - --port
          - {{ .Values.service.targetPort | quote }}
          {{- if .Values.tls.enabled }}
          {{- if .Values.tls.selfSigned }}
          - --tls-self
          {{- else if and .Values.tls.cert .Values.tls.key }}
          - --tls-cert
          - {{ .Values.tls.cert | quote }}
          - --tls-key
          - {{ .Values.tls.key | quote }}
          {{- else }}
          {{- fail "tls.enabled is true but neither tls.cert/tls.key nor tls.selfSigned are configured" }}
          {{- end }}
          {{- end }}
          {{- if eq $storageMode "bucket" }}
          - --bucket
          - {{ .Values.objectStorage.bucket | quote }}
          {{- with .Values.objectStorage.path }}
          - --path
          - {{ . | quote }}
          {{- end }}
          {{- else if eq $storageMode "volume" }}
          - --local-root
          - {{ .Values.persistentVolume.mountPath | quote }}
          {{- end }}
          {{- if eq $walMode "bucket" }}
          - --wal-bucket
          - {{ .Values.walStorage.bucket | quote }}
          {{- else if eq $walMode "volume" }}
          - --wal-local-root
          - {{ .Values.walStorage.persistentVolume.mountPath | quote }}
          {{- end }}
        ports:
        - name: http
          containerPort: {{ .Values.service.targetPort }}
          protocol: TCP
        {{- if or (and .Values.objectStorage.enabled .Values.objectStorage.endpoint) .Values.walStorage.endpoint .Values.walStorage.region .Values.env }}
        env:
        {{- if and .Values.objectStorage.enabled .Values.objectStorage.endpoint }}
        - name: AWS_ENDPOINT_URL_S3
          value: {{ .Values.objectStorage.endpoint | quote }}
        {{- end }}
        {{- with .Values.walStorage.endpoint }}
        - name: S2LITE_WAL_AWS_ENDPOINT_URL_S3
          value: {{ . | quote }}
        {{- end }}
        {{- with .Values.walStorage.region }}
        - name: S2LITE_WAL_AWS_REGION
          value: {{ . | quote }}
        {{- end }}
        {{- with .Values.env }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        {{- end }}
        livenessProbe:
          {{- if and .Values.tls.enabled .Values.livenessProbe.httpGet }}
          {{- $probe := omit .Values.livenessProbe "httpGet" }}
          {{- $httpGet := merge (dict "scheme" "HTTPS") .Values.livenessProbe.httpGet }}
          {{- $probe := merge (dict "httpGet" $httpGet) $probe }}
          {{- toYaml $probe | nindent 10 }}
          {{- else }}
          {{- toYaml .Values.livenessProbe | nindent 10 }}
          {{- end }}
        readinessProbe:
          {{- if and .Values.tls.enabled .Values.readinessProbe.httpGet }}
          {{- $probe := omit .Values.readinessProbe "httpGet" }}
          {{- $httpGet := merge (dict "scheme" "HTTPS") .Values.readinessProbe.httpGet }}
          {{- $probe := merge (dict "httpGet" $httpGet) $probe }}
          {{- toYaml $probe | nindent 10 }}
          {{- else }}
          {{- toYaml .Values.readinessProbe | nindent 10 }}
          {{- end }}
        {{- with .Values.startupProbe }}
        startupProbe:
          {{- if and $.Values.tls.enabled .httpGet }}
          {{- $probe := omit . "httpGet" }}
          {{- $httpGet := merge (dict "scheme" "HTTPS") .httpGet }}
          {{- $probe := merge (dict "httpGet" $httpGet) $probe }}
          {{- toYaml $probe | nindent 10 }}
          {{- else }}
          {{- toYaml . | nindent 10 }}
          {{- end }}
        {{- end }}
        resources:
          {{- toYaml .Values.resources | nindent 10 }}
        {{- if or $volumes .Values.volumeMounts }}
        volumeMounts:
        {{- range $name, $volume := $volumes }}
        - name: {{ $name }}
          mountPath: {{ $volume.mountPath | quote }}
        {{- end }}
        {{- with .Values.volumeMounts }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        {{- end }}
      {{- if or $volumes .Values.volumes }}
      volumes:
      {{- range $name, $volume := $volumes }}
      - name: {{ $name }}
        persistentVolumeClaim:
          claimName: {{ include "s2-lite.claimName" (dict "root" $ "name" $name "volume" $volume) }}
      {{- end }}
      {{- with .Values.volumes }}
      {{- toYaml . | nindent 6 }}
      {{- end }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
