name: Rust dependency cooldown gate
description: Reject new crates.io versions that are inside the publication cooldown

inputs:
  base-sha:
    description: Pull request base commit
    required: true
  exceptions:
    description: Optional repo-relative path to a TOML file of security exceptions (defaults to .cargo/cooldown-exceptions.toml if present)
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Check dependency publish age
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
        BASE_SHA: ${{ inputs.base-sha }}
        EXCEPTIONS_PATH: ${{ inputs.exceptions }}
      run: |
        args=(
          --repo-root "$GITHUB_WORKSPACE"
          --config "$GITHUB_WORKSPACE/.cargo/config.toml"
          --allowlist "$ACTION_PATH/first-party-crates.txt"
        )
        if [ -n "$EXCEPTIONS_PATH" ]; then
          args+=(--exceptions="$EXCEPTIONS_PATH")
        fi
        env -i \
          HOME="$RUNNER_TEMP" \
          PATH="/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin" \
          python3 "$ACTION_PATH/check.py" \
            "${args[@]}" \
            "$BASE_SHA"
