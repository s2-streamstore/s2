name: release-plz

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'charts/**'
  workflow_dispatch:

permissions:
  pull-requests: write
  contents: write

# Serialize runs so an older run's release PR update cannot land after a newer run's lockfile refresh.
concurrency:
  group: release-plz
  cancel-in-progress: false

jobs:
  release-plz:
    runs-on: ubuntu-latest
    environment: release
    steps:
      - name: Generate GitHub token
        uses: actions/create-github-app-token@f8d387b68d61c58ab83c6c016672934102569859 # v3.0.0
        id: generate-token
        with:
          app-id: ${{ secrets.RELEASE_PLZ_APP_ID }}
          private-key: ${{ secrets.RELEASE_PLZ_APP_PRIVATE_KEY }}

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          submodules: true
          token: ${{ steps.generate-token.outputs.token }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      # cargo-semver-checks builds s2-api with all features, and `codegen` runs protoc.
      - name: Install Protoc
        uses: arduino/setup-protoc@c65c819552d16ad3c9b72d9dfd5ba5237b9c906b # v3.0.0
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Run release-plz
        id: release-plz
        uses: release-plz/action@66b324fd6c72d05d2a08568492ecdd62bfb8a62b # v0.5.148
        with:
          command: release-pr
        env:
          GITHUB_TOKEN: ${{ steps.generate-token.outputs.token }}

      - name: Refresh simulator lockfile in release PR
        env:
          GH_TOKEN: ${{ steps.generate-token.outputs.token }}
          RELEASE_PR: ${{ steps.release-plz.outputs.pr }}
        run: |
          set -euo pipefail

          if [[ -z "$RELEASE_PR" || "$RELEASE_PR" == "null" ]]; then
            exit 0
          fi

          pr_number="$(jq -r '.number // empty' <<<"$RELEASE_PR")"
          if [[ -z "$pr_number" ]]; then
            exit 0
          fi

          gh pr checkout "$pr_number"
          cargo metadata --manifest-path sim/Cargo.toml --format-version 1 >/dev/null
          cargo metadata --locked --manifest-path sim/Cargo.toml --format-version 1 >/dev/null

          if git diff --quiet -- sim/Cargo.lock; then
            exit 0
          fi

          # Must stay a [bot] identity: release-plz closes and reopens release PRs with non-bot commits.
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sim/Cargo.lock
          git commit -m "chore: refresh simulator lockfile"
          git push
