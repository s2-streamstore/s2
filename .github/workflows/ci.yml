name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A new push to a PR cancels its in-flight run; pushes to main never share a group.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  rust-dependency-cooldown:
    name: Rust dependency cooldown gate
    permissions:
      contents: read
    uses: $/.github/workflows/rust-dependency-cooldown.yml

  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      sdk: ${{ steps.filter.outputs.sdk }}
      apply_schema: ${{ steps.filter.outputs.apply_schema }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: dorny/paths-filter@fbd0ab8f3e69293af611ebaee6363fc25e6d187d # v4.0.1
        id: filter
        with:
          filters: |
            sdk:
              - 'sdk/**'
            apply_schema:
              - 'cli/src/cli.rs'
              - 'cli/src/main.rs'
              - 'lite/src/init.rs'
              - 'cli/schema.json'

  cli-schema-drift:
    name: CLI Schema Drift
    needs: [changes, rust-dependency-cooldown]
    if: needs.changes.outputs.apply_schema == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          submodules: true
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Generate apply schema
        run: cargo run --locked -q -p s2-cli -- apply --schema > /tmp/apply.schema.json
      - name: Check for schema drift
        run: diff -u cli/schema.json /tmp/apply.schema.json

  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: dtolnay/rust-toolchain@7c8d7d138f5c09cef361f8214cf96882cd029cdb # nightly
        with:
          components: rustfmt
      - run: cargo +nightly fmt --all --check
      - run: cargo +nightly fmt --manifest-path sim/Cargo.toml --check

  lockfile:
    name: Lockfile
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - name: Verify Cargo.lock is up-to-date
        run: |
          cargo metadata --locked --format-version 1 >/dev/null
          cargo metadata --locked --manifest-path sim/Cargo.toml --format-version 1 >/dev/null

  sort:
    name: Cargo Sort
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      # v2.1.4 assets were replaced; retain the recorded v2.1.3 checksum.
      - uses: taiki-e/install-action@84f765ae4b60a8aa21ae300a812fd0434d708108 # cargo-sort
        with:
          tool: cargo-sort@2.1.3
          checksum: true
      - run: cargo sort --workspace --check

  deny:
    name: Cargo Deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - uses: taiki-e/install-action@994cebbc19c36971116a6d44f4408834ada6522e # cargo-deny
      - run: cargo deny check

  clippy:
    name: Clippy
    needs: rust-dependency-cooldown
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          submodules: true
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Install Protoc
        uses: arduino/setup-protoc@c65c819552d16ad3c9b72d9dfd5ba5237b9c906b # v3.0.0
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - run: cargo clippy --locked --workspace --all-features --all-targets -- -D warnings --allow deprecated
      - name: Clippy (simulator)
        env:
          RUSTFLAGS: --cfg tokio_unstable
        run: cargo clippy --locked --manifest-path sim/Cargo.toml --all-targets -- -D warnings --allow deprecated

  test:
    name: Tests
    needs: rust-dependency-cooldown
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          submodules: true
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: arduino/setup-protoc@c65c819552d16ad3c9b72d9dfd5ba5237b9c906b # v3.0.0
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: taiki-e/install-action@d5f9268ff7620505a81ada10ddf18cdd72240185 # nextest
      - run: cargo nextest run --locked --workspace --all-features --exclude s2-sdk --exclude s2-testcontainers -E 'not (package(s2-cli) & binary(integration))'

  testcontainers:
    name: Testcontainers
    needs: rust-dependency-cooldown
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          submodules: true
      - name: Resolve source revision
        id: source_revision
        run: echo "value=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0
      - name: Read image version
        id: image-version
        run: |
          VERSION=$(sed -n 's/^version = "\(.*\)"$/\1/p' testcontainers/Cargo.toml | head -n1)
          echo "value=${VERSION}" >> "$GITHUB_OUTPUT"
      - name: Build local S2 Docker image
        uses: docker/build-push-action@d08e5c354a6adb9ed34480a06d141179aa583294 # v7.0.0
        with:
          context: .
          target: runtime
          tags: ghcr.io/s2-streamstore/s2:${{ steps.image-version.outputs.value }}
          load: true
          build-args: |
            S2_GIT_REV=${{ steps.source_revision.outputs.value }}
          cache-from: type=gha,scope=s2-testcontainers
          cache-to: type=gha,mode=max,scope=s2-testcontainers
      - name: Verify image source revision
        env:
          S2_GIT_REV: ${{ steps.source_revision.outputs.value }}
        run: |
          docker run --rm ghcr.io/s2-streamstore/s2:${{ steps.image-version.outputs.value }} --version \
            | grep -F "rev $S2_GIT_REV"
      - run: cargo test --locked -p s2-testcontainers

  simulation:
    name: Simulation Tests
    needs: rust-dependency-cooldown
    # arm64, deliberately: on x86_64 Linux, fastant (via slatedb -> foyer) runs
    # a pre-main TSC calibration loop that spins forever under mad-turmoil's
    # interposed clock_gettime, hanging the simulator at startup. On aarch64
    # fastant does not take that code path. Revisit if mad-turmoil falls back
    # to the real clock outside simulation context.
    runs-on: ubuntu-24.04-arm
    # Simulations that lose determinism or deadlock can hang; fail fast.
    timeout-minutes: 30
    env:
      # Required so turmoil can seed tokio's internal RNG for determinism.
      RUSTFLAGS: --cfg tokio_unstable
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          submodules: true
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: arduino/setup-protoc@c65c819552d16ad3c9b72d9dfd5ba5237b9c906b # v3.0.0
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Build simulator
        run: cargo build --locked --manifest-path sim/Cargo.toml --profile sim

      # Determinism first: a broken meta test means seeds are not reproducible
      # and any linearizability failure would not be debuggable. Children
      # inherit RUST_LOG; trace level compares vastly more output (~50MB vs a
      # dozen lines per run), catching nondeterminism that info level misses.
      - name: Determinism (meta) tests
        env:
          RUST_LOG: trace
        run: |
          ./sim/target/sim/sim meta smoke --seed 1
          ./sim/target/sim/sim meta linearizable --seed 1
          ./sim/target/sim/sim meta linearizable --seed 2 --fail-rate 0.005

      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: stable
          cache: false
      # Built from the s2-verification rev the simulator's history collector
      # is locked to, so the history format matches.
      - name: Build s2-porcupine checker
        run: |
          rev=$(sed -n 's|^source = "git+https://github.com/s2-streamstore/s2-verification?rev=[0-9a-f]*#\([0-9a-f]*\)"$|\1|p' sim/Cargo.lock)
          git clone https://github.com/s2-streamstore/s2-verification /tmp/s2-verification
          git -C /tmp/s2-verification checkout "$rev"
          cd /tmp/s2-verification/golang/s2-porcupine
          go build -o /tmp/s2-porcupine .

      # Neither the simulator nor the checker has a wall-clock limit of its own:
      # the simulator's limit counts simulated time, and the checker can search
      # a very ambiguous history for hours. Fail the step instead of hitting the
      # job timeout, which cancels the job and skips uploading the histories.
      - name: Linearizability tests
        run: |
          check() {
            seed=$1
            shift
            echo "::group::seed $seed $*"
            timeout 2m ./sim/target/sim/sim "$@" linearizable --seed "$seed" --clients 3 --ops-per-client 50
            timeout 5m /tmp/s2-porcupine -file="history.$seed.jsonl"
            echo "::endgroup::"
          }
          for seed in $(seq 1 5); do check "$seed"; done
          # And under network chaos (message loss).
          for seed in $(seq 6 25); do check "$seed" --fail-rate 0.005; done

      - name: Upload histories on failure
        if: failure()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: sim-histories
          path: |
            history.*.jsonl
            porcupine-outputs/
          if-no-files-found: ignore

  helm-lint:
    name: Helm Chart Lint & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install Helm
        uses: azure/setup-helm@dda3372f752e03dde6b3237bc9431cdc2f7a02a2 # v5.0.0
        with:
          version: v3.14.0

      - name: Lint Helm chart
        run: helm lint charts/s2-lite-helm

      - name: Test template rendering (default)
        run: helm template test-release charts/s2-lite-helm --dry-run > /dev/null

      - name: Test with TLS self-signed
        run: helm template test-release charts/s2-lite-helm --set tls.enabled=true --set tls.selfSigned=true --dry-run > /dev/null

      - name: Test with TLS provided cert
        run: helm template test-release charts/s2-lite-helm --set tls.enabled=true --set tls.cert=/etc/tls/tls.crt --set tls.key=/etc/tls/tls.key --dry-run > /dev/null

      - name: Test image reference
        run: |
          set -euo pipefail
          image() { helm template test-release charts/s2-lite-helm --show-only templates/deployment.yaml "$@" | sed -n 's/^ *image: *//p' | head -1; }
          repo=ghcr.io/s2-streamstore/s2
          version=$(sed -n 's/^appVersion: "\(.*\)"$/\1/p' charts/s2-lite-helm/Chart.yaml)
          digest="sha256:$(printf '%064d' 0)"
          [ "$(image --set image.digest=)" = "$repo:$version" ]
          [ "$(image --set image.digest="$digest")" = "$repo:$version@$digest" ]
          [ "$(image --set image.digest="$digest" --set image.tag=custom)" = "$repo:custom" ]

      - name: Test with S3 object storage
        run: helm template test-release charts/s2-lite-helm --set objectStorage.enabled=true --set objectStorage.bucket=test-bucket --dry-run > /dev/null

      - name: Test with S3 and TLS
        run: |
          helm template test-release charts/s2-lite-helm \
            --set tls.enabled=true \
            --set tls.selfSigned=true \
            --set objectStorage.enabled=true \
            --set objectStorage.bucket=test-bucket \
            --set objectStorage.endpoint=https://s3.amazonaws.com \
            --set metrics.serviceMonitor.enabled=true \
            --dry-run > /dev/null

      - name: Test TLS without cert/key fails but selfSigned and provided cert work
        run: |
          if helm template test-release charts/s2-lite-helm \
            --set tls.enabled=true \
            --dry-run 2>&1; then
            echo "Expected failure but got success"
            exit 1
          fi
          helm template test-release charts/s2-lite-helm \
            --set tls.enabled=true \
            --set tls.selfSigned=true \
            --dry-run > /dev/null
          helm template test-release charts/s2-lite-helm \
            --set tls.enabled=true \
            --set tls.cert=/etc/tls/tls.crt \
            --set tls.key=/etc/tls/tls.key \
            --dry-run > /dev/null

      - name: Test objectStorage without bucket fails
        run: |
          if helm template test-release charts/s2-lite-helm \
            --set objectStorage.enabled=true \
            --dry-run 2>&1; then
            echo "Expected failure but got success"
            exit 1
          fi

      - name: Test with persistent volume and WAL storage
        run: |
          helm template test-release charts/s2-lite-helm \
            --set persistentVolume.enabled=true \
            --set walStorage.persistentVolume.enabled=true \
            --dry-run > /dev/null
          helm template test-release charts/s2-lite-helm \
            --set objectStorage.enabled=true \
            --set objectStorage.bucket=test-bucket \
            --set walStorage.bucket=test-wal-bucket \
            --dry-run > /dev/null

  build-server:
    name: Build s2-lite
    needs: rust-dependency-cooldown
    uses: ./.github/workflows/build-s2-lite.yml
    with:
      ref: ${{ github.sha }}

  sdk-integration-tests:
    name: SDKs <> s2-lite Integration Tests
    needs: [build-server, test, clippy]
    uses: ./.github/workflows/sdk-tests.yml
    with:
      mode: local
      server-binary: server
      server-args: "--port 8080"
      server-port: 8080
      sdks: |
        [
          {
            "name": "go",
            "repo": "s2-streamstore/s2-sdk-go",
            "ref": "main",
            "lang": "go",
            "go-version": "1.26",
            "test_cmd": "go test -v -count=1 -skip 'WithScope|AccessToken|Metrics|Client_InvalidToken|Location' ./s2/..."
          },
          {
            "name": "typescript",
            "repo": "s2-streamstore/s2-sdk-typescript",
            "ref": "main",
            "lang": "bun",
            "bun-version": "latest",
            "test_cmd": "S2_LITE=1 bun run vitest --run --exclude '**/account-basin*' --exclude '**/accessTokens*' --exclude '**/metrics*'"
          },
          {
            "name": "python",
            "repo": "s2-streamstore/s2-sdk-python",
            "ref": "main",
            "lang": "python",
            "uv-version": "0.11.6",
            "test_cmd": "uv run pytest tests/ -v -s -m '(account or basin or stream) and not access_tokens and not locations'"
          },
          {
            "name": "rust",
            "repo": "${{ github.repository }}",
            "ref": "${{ github.sha }}",
            "lang": "rust",
            "test_cmd": "cargo test --locked -p s2-sdk --all-features -- --skip access_token --skip metrics"
          }
        ]

  rust-sdk:
    name: Rust SDK
    needs: [test, clippy, changes]
    if: needs.changes.outputs.sdk == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Check docs
        run: cargo doc --locked -p s2-sdk --all-features --no-deps
        env:
          RUSTDOCFLAGS: "-D warnings"
      - name: Run tests
        # These run against S2 cloud, and fork PRs don't get the token.
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        run: cargo test --locked -p s2-sdk --all-features
        env:
          S2_ACCESS_TOKEN: ${{ secrets.S2_ACCESS_TOKEN_FOR_RUST_SDK_TESTS }}

  cli-integration-tests:
    name: CLI <> s2-lite Integration Tests
    needs: [build-server, test, clippy]
    uses: ./.github/workflows/sdk-tests.yml
    with:
      mode: local
      server-binary: server
      server-args: "--port 8080"
      server-port: 8080
      sdks: |
        [
          {
            "name": "cli",
            "repo": "${{ github.repository }}",
            "ref": "${{ github.sha }}",
            "lang": "rust",
            "test_cmd": "cargo test --locked -p s2-cli --test integration -j 1"
          }
        ]

  # The single check to require on main. A required check that was skipped
  # counts as passing, so requiring the jobs directly would let a PR merge while
  # the cooldown gate holds them back.
  ci-result:
    name: CI Result
    if: ${{ !cancelled() }}
    needs:
      - rust-dependency-cooldown
      - changes
      - cli-schema-drift
      - fmt
      - lockfile
      - sort
      - deny
      - clippy
      - test
      - testcontainers
      - simulation
      - helm-lint
      - build-server
      - sdk-integration-tests
      - rust-sdk
      - cli-integration-tests
    runs-on: ubuntu-latest
    steps:
      - name: Check job results
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: exit 1
