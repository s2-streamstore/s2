name: Simulation Nightly

on:
  schedule:
    - cron: "0 8 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sweep:
    name: Linearizability sweep
    # arm64, for the same reason as Simulation Tests in ci.yml.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    env:
      # Required so turmoil can seed tokio's internal RNG for determinism.
      RUSTFLAGS: --cfg tokio_unstable
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          submodules: true
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: arduino/setup-protoc@c65c819552d16ad3c9b72d9dfd5ba5237b9c906b # v3.0.0
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Build simulator
        run: cargo build --locked --manifest-path sim/Cargo.toml --profile sim

      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: stable
          cache: false
      - name: Build s2-porcupine checker
        run: |
          rev=$(sed -n 's|^source = "git+https://github.com/s2-streamstore/s2-verification?rev=[0-9a-f]*#\([0-9a-f]*\)"$|\1|p' sim/Cargo.lock)
          git clone https://github.com/s2-streamstore/s2-verification /tmp/s2-verification
          git -C /tmp/s2-verification checkout "$rev"
          cd /tmp/s2-verification/golang/s2-porcupine
          go build -o /tmp/s2-porcupine .

      # A new block of seeds each night, so coverage accumulates. Only failing
      # seeds keep their logs and histories, for replaying with the same seed.
      #
      # Each seed is bounded in wall-clock time (the simulator's own limit counts
      # simulated time), and no new seed starts after 30 minutes, so the step
      # ends before the job timeout, which would cancel the job and skip the
      # upload.
      - name: Sweep seeds under message loss
        run: |
          first=$(( $(date -u +%s) / 86400 * 1000 ))
          last=$(( first + 499 ))
          deadline=$(( SECONDS + 30 * 60 ))
          failed=()
          for seed in $(seq "$first" "$last"); do
            if [ "$SECONDS" -ge "$deadline" ]; then
              echo "::warning::out of time, stopping before seed $seed"
              last=$(( seed - 1 ))
              break
            fi
            if timeout 2m ./sim/target/sim/sim --fail-rate 0.005 linearizable --seed "$seed" --clients 3 --ops-per-client 50 > "sim.$seed.log" 2>&1 \
              && timeout 5m /tmp/s2-porcupine -file="history.$seed.jsonl" > "porcupine.$seed.log" 2>&1; then
              rm -f "sim.$seed.log" "porcupine.$seed.log" "history.$seed.jsonl" porcupine-outputs/history."$seed"-*.html
            else
              echo "::error::seed $seed failed"
              failed+=("$seed")
            fi
          done
          echo "seeds $first-$last: ${#failed[@]} failed ${failed[*]}"
          [ "${#failed[@]}" -eq 0 ]

      - name: Upload failing seeds
        if: failure()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: sim-nightly-failures
          path: |
            sim.*.log
            porcupine.*.log
            history.*.jsonl
            porcupine-outputs/
          if-no-files-found: ignore
